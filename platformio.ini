; ESP32-S3 Deauther + Apple Juice — Guition ESP32-4848S040
; Web interface removed: control is via the 480x480 GT911 touchscreen,
; same display/touch stack and UI layout as the wifiscan app.
;
; Two environments, one source tree:
;   esp32-4848s040      — Arduino core 3.x (pioarduino). BLE spam works;
;                         raw deauth frame TX is blocked by the IDF 5.x
;                         WiFi stack ("unsupport frame type: 0xc0").
;   esp32-4848s040-idf4 — Arduino core 2.0.17 / IDF 4.4 (espressif32@6.11.0).
;                         Deauth frames transmit — use this for the deauth
;                         tool.
[env:esp32-4848s040]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv

upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1

lib_ldf_mode = deep
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.4
  https://github.com/tamctec/gt911-arduino.git

[env:esp32-4848s040-idf4]
platform = espressif32@6.11.0
board = esp32-s3-devkitm-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv

upload_port = COM3
monitor_port = COM3
upload_speed = 921600
monitor_speed = 115200

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -Wl,-z,muldefs

lib_ldf_mode = deep
lib_deps =
  moononournation/GFX Library for Arduino @ 1.5.0
  https://github.com/tamctec/gt911-arduino.git

